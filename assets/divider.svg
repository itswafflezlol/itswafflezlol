  <linearGradient id="dv-wtitle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE7A3"/><stop offset="0.5" stop-color="#F5A623"/>
    <stop offset="1" stop-color="#E08A1E"/>
  </linearGradient>
  <filter id="dv-wblur" x="-60%" y="-60%" width="220%" height="220%">
